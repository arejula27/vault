---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: vault-gnome
description: Vault OS — GNOME variant

base-image: ghcr.io/arejula27/vault-base
image-version: latest

modules:
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - com.brave.Browser
          - org.gnome.Extensions
          - org.gnome.tweaks

  - type: signing
